services:
  vts-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: vts-server:dev
    container_name: vts-server
    ports:
      - "9000:9000"
    environment:
      VTS_PORT: "9000"
      VTS_DATA: "/data"
    volumes:
      # dữ liệu tài khoản/nhân vật sống sót qua các lần rebuild container
      - ../server-data:/data
    restart: unless-stopped
